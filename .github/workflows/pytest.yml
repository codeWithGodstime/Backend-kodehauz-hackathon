name: Pytest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    env:
      PROJECT_NAME: "Project Name"
      SERVER_NAME: localhost
      SERVER_HOST: https://localhost
      FIRST_SUPERUSER: superuser@example.org
      FIRST_SUPERUSER_PASSWORD: "some password"
      CLIENT_NAME: localhost
      CLIENT_HOST: https://localhost
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install virtualenv
          virtualenv venv
          source venv/bin/activate
          pip install poetry
          poetry install
      - name: Run tests
        run: |
          source venv/bin/activate
          mkdir ./tmp
          bash ./tests-start.sh
